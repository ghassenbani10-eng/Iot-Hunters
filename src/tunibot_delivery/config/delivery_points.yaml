# Named locations in the SLAM map frame.
# The robot is spawned on the dock at Gazebo world (-9.0, 2.2, yaw 0) - north-west
# corner of the dining room - and Cartographer starts the map there, so:
#     map = world + (9.0, -2.2)
#
# Each place is a flat list of one or more approach poses [x, y, yaw, x2, y2, yaw2, ...]
# (metres, metres, radians). The delivery manager tries them in order: if the
# first approach is blocked (people, chairs moved...), it uses the next one.
delivery_manager:
  ros__parameters:
    dock:      [0.0, 0.0, 0.0]     # on the charging pad (world -9.0, 2.2)
    pre_dock:  [1.2, 0.0, 0.0]     # 1.2 m in front of the dock, final approach is a straight reverse
    # serving windows of the kitchen (the robot faces the window, trays towards the cook);
    # window 2 is used automatically when window 1 is blocked
    pickup:    [2.5, 0.2, 1.5708,  4.0, 0.2, 1.5708]   # world (-6.5, 2.4) / (-5.0, 2.4): 25 cm from the counter
    # (the third opening, x -3.3, is the takeaway counter for customers: queue zone, keepout)
    # dining room (Phase 1 tables) - second pose = the other side of the table group
    table_1:   [2.83, -10.20, 1.5708, 2.83, -6.50, -1.5708]
    table_2:   [7.82, -10.18, 1.5708, 7.82, -6.50, -1.5708]
    table_3:   [11.82, -10.22, 1.5708, 11.82, -6.50, -1.5708]
    table_4:   [6.40, -6.02, 1.5708, 6.40, -3.40, -1.5708]
    table_5:   [9.40, -5.97, 1.5708, 9.40, -3.40, -1.5708]
    table_6:   [13.41, -6.01, 1.5708, 13.41, -3.40, -1.5708]
    table_7:   [2.44, -6.01, 1.5708, 2.44, -3.40, -1.5708]
    # VIP lounge (Phase 2): door D2 -> 1.05 m corridor -> L-turn -> 1.36 m corridor -> door D3
    table_8:   [9.50, 5.10, -1.5708, 9.50, 2.50, 1.5708]    # VIP 1 (world 0.5, 6.0)
    table_9:   [13.50, 5.10, -1.5708, 13.50, 2.50, 1.5708]   # VIP 2 (world 4.5, 6.0)
    tables: ["table_1", "table_2", "table_3", "table_4", "table_5", "table_6", "table_7", "table_8", "table_9"]
    load_time_sec: 5.0            # waiting at the serving window while the cook loads the trays
    pickup_depart_yaw: -1.5708    # after loading: back out to the staging pose, turn to face the dining room
    pickup_staging_dist: 0.6      # Nav2 stops 0.6 m before a window, the last 0.6 m is a straight creep
    serve_time_sec: 8.0           # waiting at the table while the customer takes the order
    idle_dock_timeout_sec: 20.0   # return to dock when idle for this long
    battery_critical: 10.0        # %: abort everything, go to the dock now (safety net)
    battery_low: 25.0             # %: never leave with an order below this
    battery_resume: 60.0          # %: charging target when no order is waiting
    energy_reserve: 12.0          # % of capacity that must still be there once docked
    energy_safety_factor: 1.3     # margin on the path-length based energy estimate

battery_simulator:
  ros__parameters:
    capacity_ah: 10.0             # 7S Li-ion, 25.9 V nominal -> 259 Wh
    cells_in_series: 7
    initial_soc: 100.0
    time_acceleration: 25.0       # energy flows x25 so a full cycle fits in a demo
    idle_power_w: 28.0            # computer + lidar + screen + motor drivers idle
    drive_power_w: 12.0
    mass_kg: 40.0
    payload_kg: 4.0               # loaded trays
    charge_power_w: 240.0         # charger (CC phase), CV taper above 80 %
    dock_x: 0.0
    dock_y: 0.0
    dock_tolerance: 0.15
