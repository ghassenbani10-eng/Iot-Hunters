# Nav2 parameters for the TuniBot waiter robot (ROS 2 Humble) - Phase 2.
#
# Robot: differential drive, 0.54 x 0.50 m footprint (incl. wheels), 2D lidar
# (290 deg, 12 m) at 18 cm, 1.1 m tall shelf robot.
#
# Phase 2 changes (dynamic obstacles, narrow passages, recovery):
#  - cruise speed 0.22 -> 0.40 m/s, with a social speed governor (/speed_limit
#    from people_tracker: slower near people, in doorways and corridors)
#  - collision_monitor between the velocity smoother and the wheels: stop zone,
#    slowdown zone and time-to-collision approach on the raw lidar scan
#  - people_filter (KeepoutFilter on a dynamic mask) in both costmaps: the
#    predicted positions of walking people over the next 2 s
#  - local costmap 10 Hz / 5 m, global costmap 2 Hz so moving people are seen
#  - custom behavior tree (config/navigate_tunibot.xml): 2 Hz replanning,
#    wait-first recovery, backup, spin
#  - progress checker tolerant to the robot yielding to people
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5           # people are not in the map: tolerate unexplained beams
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: ''   # set by navigation.launch.py -> config/navigate_tunibot.xml
    plugin_lib_names: [nav2_compute_path_to_pose_action_bt_node, nav2_compute_path_through_poses_action_bt_node, nav2_smooth_path_action_bt_node,
      nav2_follow_path_action_bt_node, nav2_spin_action_bt_node, nav2_wait_action_bt_node, nav2_assisted_teleop_action_bt_node,
      nav2_back_up_action_bt_node, nav2_drive_on_heading_bt_node, nav2_clear_costmap_service_bt_node, nav2_is_stuck_condition_bt_node,
      nav2_goal_reached_condition_bt_node, nav2_goal_updated_condition_bt_node, nav2_globally_updated_goal_condition_bt_node,
      nav2_is_path_valid_condition_bt_node, nav2_initial_pose_received_condition_bt_node, nav2_reinitialize_global_localization_service_bt_node,
      nav2_rate_controller_bt_node, nav2_distance_controller_bt_node, nav2_speed_controller_bt_node, nav2_truncate_path_action_bt_node,
      nav2_truncate_path_local_action_bt_node, nav2_goal_updater_node_bt_node, nav2_recovery_node_bt_node, nav2_pipeline_sequence_bt_node,
      nav2_round_robin_node_bt_node, nav2_transform_available_condition_bt_node, nav2_time_expired_condition_bt_node, nav2_path_expiring_timer_condition,
      nav2_distance_traveled_condition_bt_node, nav2_single_trigger_bt_node, nav2_goal_updated_controller_bt_node, nav2_is_battery_low_condition_bt_node,
      nav2_navigate_through_poses_action_bt_node, nav2_navigate_to_pose_action_bt_node, nav2_remove_passed_goals_action_bt_node,
      nav2_planner_selector_bt_node, nav2_controller_selector_bt_node, nav2_goal_checker_selector_bt_node, nav2_controller_cancel_bt_node,
      nav2_path_longer_on_approach_bt_node, nav2_wait_cancel_bt_node, nav2_spin_cancel_bt_node, nav2_back_up_cancel_bt_node,
      nav2_assisted_teleop_cancel_bt_node, nav2_drive_on_heading_cancel_bt_node, nav2_is_battery_charging_condition_bt_node]
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters: {use_sim_time: true}
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters: {use_sim_time: true}
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    # the robot may legitimately stand still while a person crosses: 15 s allowance
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.3, movement_time_allowance: 15.0}
    # heading is NOT checked by Nav2 (Humble RPP prunes the whole path once inside the xy
    # tolerance and then aborts with "plan has 0 poses"): the delivery manager turns the
    # robot to the final heading itself (window / table / dock axis)
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.25, yaw_goal_tolerance: 3.14}
    FollowPath: {plugin: 'nav2_rotation_shim_controller::RotationShimController', primary_controller: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController',
      angular_dist_threshold: 0.785, forward_sampling_distance: 0.5, rotate_to_heading_angular_vel: 0.8, max_angular_accel: 2.0,
      simulate_ahead_time: 1.0, desired_linear_vel: 0.40, lookahead_dist: 0.7, min_lookahead_dist: 0.35, max_lookahead_dist: 1.0,
      lookahead_time: 1.5, transform_tolerance: 0.5, use_velocity_scaled_lookahead_dist: true, min_approach_linear_velocity: 0.05,
      approach_velocity_scaling_dist: 0.8, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.5,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: true, regulated_linear_scaling_min_radius: 0.9,
      regulated_linear_scaling_min_speed: 0.10, cost_scaling_dist: 0.5, cost_scaling_gain: 1.0, inflation_cost_scaling_factor: 4.0,
      use_rotate_to_heading: false,
      allow_reversing: false, max_robot_pose_search_dist: 10.0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.5
      plugins: [obstacle_layer, inflation_layer]
      filters: [keepout_filter, people_filter]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[0.27, 0.25], [0.27, -0.25], [-0.27, -0.25], [-0.27, 0.25]]'
      keepout_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /costmap_filter_info}
      people_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /people/filter_info}
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0,
          raytrace_min_range: 0.0, obstacle_max_range: 6.0, obstacle_min_range: 0.0}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: [static_layer, obstacle_layer, inflation_layer]
      filters: [keepout_filter, people_filter]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 8.0,
          raytrace_min_range: 0.0, obstacle_max_range: 6.0, obstacle_min_range: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[0.27, 0.25], [0.27, -0.25], [-0.27, -0.25], [-0.27, 0.25]]'
      keepout_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /costmap_filter_info}
      people_filter: {plugin: 'nav2_costmap_2d::KeepoutFilter', enabled: true, filter_info_topic: /people/filter_info}
map_server:
  ros__parameters: {use_sim_time: true, yaml_filename: ''}
map_saver:
  ros__parameters: {use_sim_time: true, save_map_timeout: 5.0, free_thresh_default: 0.25, occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner/NavfnPlanner, tolerance: 0.25, use_astar: true, allow_unknown: false}
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: nav2_behaviors/Spin}
    backup: {plugin: nav2_behaviors/BackUp}
    drive_on_heading: {plugin: nav2_behaviors/DriveOnHeading}
    wait: {plugin: nav2_behaviors/Wait}
    assisted_teleop: {plugin: nav2_behaviors/AssistedTeleop}
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
robot_state_publisher:
  ros__parameters: {use_sim_time: true}
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.0, 0.9]
    min_velocity: [-0.15, 0.0, -0.9]
    max_accel: [0.6, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_raw
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # footprint: x in [-0.27, 0.27], y in [-0.25, 0.25]; the lidar sees the front 290 deg
    polygons: [PolygonStop, PolygonSlow]
    # Static polygons do not depend on the motion: a large stop zone also freezes
    # rotation, and a robot turning in place 0.5 m from a wall (serving window)
    # would sweep its corner over the wall and never be able to turn away.
    # So: a small "bumper" stop zone + a slowdown zone. The footprint collision check
    # of the controller (RPP, along the path to the carrot) prevents driving into
    # obstacles; the "approach" model was tested and removed: near walls it toggled
    # approach/continue every 100-200 ms and made the robot stutter.
    # Both zones start OUTSIDE the footprint (front face at x = 0.27): lidar returns
    # inside the footprint can only be the robot itself (seen intermittently on the
    # base edge when the robot pitches while braking) and froze the robot for good.
    PolygonStop:     # something within 7 cm of the bumper, in front: immediate stop
      type: polygon
      points: [0.34, 0.22, 0.34, -0.22, 0.28, -0.22, 0.28, 0.22]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    PolygonSlow:     # something within 45 cm ahead: 50 % speed
      type: polygon
      points: [0.72, 0.30, 0.72, -0.30, 0.28, -0.30, 0.28, 0.30]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: polygon_slowdown
      enabled: true
    FootprintApproach:   # never less than 1.2 s to collision along the commanded motion
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan: {type: scan, topic: /scan, enabled: true}
filter_mask_server:
  ros__parameters: {use_sim_time: true, frame_id: map, topic_name: /keepout_filter_mask, yaml_filename: ''}
costmap_filter_info_server:
  ros__parameters: {use_sim_time: true, type: 0, filter_info_topic: /costmap_filter_info, mask_topic: /keepout_filter_mask,
    base: 0.0, multiplier: 1.0}
people_tracker:
  ros__parameters:
    use_sim_time: true
    horizon: 2.0
    near_distance: 1.2
    near_speed_pct: 45.0
    close_distance: 2.2
    close_speed_pct: 70.0
    zone_speed_pct: 60.0
    # narrow passages, map frame (= world + (9, -2.2)): [xmin, xmax, ymin, ymax] * n
    #   service door D2 + service corridor, west corridor, lounge door D3
    slow_zones: [15.9, 17.5, 0.0, 8.2,
                 6.4, 17.5, 6.6, 8.2,
                 9.7, 11.2, 5.8, 7.5]
